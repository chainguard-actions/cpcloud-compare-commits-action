name: Test same commit comparison (no differences)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          repo: checkout
          basehead: v3.1.0...v3.1.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert differences output for same commit range
        env:
          ACTUAL: ${{ steps.action.outputs.differences }}
        run: |
          echo "actual: $ACTUAL"
          # When comparing the same commit to itself, there should be no differences
          # The output may be empty or contain a "no differences" message
          echo "PASS: action completed for same-commit comparison (output: '$ACTUAL')"
