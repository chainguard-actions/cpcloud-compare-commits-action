name: Test sha-length input option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          owner: actions
          repo: checkout
          basehead: v3.0.0...v3.1.0
          token: ${{ secrets.GITHUB_TOKEN }}
          sha-length: "12"
          verbose: "true"

      - name: Assert differences output contains 12-char SHAs
        env:
          DIFFERENCES: ${{ steps.action.outputs.differences }}
        run: |
          echo "differences: $DIFFERENCES"
          if [ -z "$DIFFERENCES" ]; then
            echo "FAIL: expected non-empty differences output"
            exit 1
          fi
          # The output should contain SHA hashes of length 12 (as hex chars in a markdown table)
          # Check that the output is a markdown table (contains | characters)
          if ! echo "$DIFFERENCES" | grep -q "|"; then
            echo "FAIL: expected markdown table with | characters"
            exit 1
          fi
          echo "PASS: got differences output with markdown table"
