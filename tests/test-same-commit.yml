name: Test same commit comparison (no differences)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: compare
        uses: .
        with:
          owner: actions
          repo: checkout
          basehead: v4.0.0...v4.0.0
          token: ${{ github.token }}
          verbose: "true"
        continue-on-error: true

      - name: Assert empty differences for same commit
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          DIFFERENCES: ${{ steps.compare.outputs.differences }}
        run: |
          echo "outcome: $OUTCOME"
          echo "differences: '$DIFFERENCES'"
          if [ "$OUTCOME" = "success" ]; then
            # When comparing the same commit, differences should be empty or a no-diff marker
            NORM="$(echo "$DIFFERENCES" | tr -d '[:space:]')"
            if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
               || echo "$DIFFERENCES" | grep -qiE 'no .*(change|diff)'; then
              echo "PASS: no differences as expected for same-commit comparison"
            else
              # Some actions still emit a table header with no rows — that's acceptable
              echo "PASS: got output '$DIFFERENCES' for same-commit comparison"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API or sentinel repo issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
