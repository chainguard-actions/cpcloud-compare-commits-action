name: Update Dependencies
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  flake-update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        input:
          - nixpkgs
          - pre-commit-hooks
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Install Nix
        uses: cachix/install-nix-action@d56f3ce9be45c562799280e8a561fbbe8f36de44 # v16
        with:
          nix_path: nixpkgs=channel:nixos-unstable-small
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Get current commit
        uses: cpcloud/flake-dep-info-action@8334941bf125773c0e9703e6b77ed133844f618b # main
        id: get_current_commit
        with:
          input: ${{ matrix.input }}

      - name: Update ${{ matrix.input }}
        env:
          MATRIX_INPUT: ${{ matrix.input }}
        run: nix flake lock --update-input "$MATRIX_INPUT"

      - name: Get new commit
        uses: cpcloud/flake-dep-info-action@8334941bf125773c0e9703e6b77ed133844f618b # main
        id: get_new_commit
        with:
          input: ${{ matrix.input }}

      - name: Get commit details for ${{ matrix.input }} changes
        uses: cpcloud/compare-commits-action@6d3691812b0c9a3a2b832e8dfe30ea1a0c07355d # v5.0.9
        id: compare_commits
        if: ${{ steps.get_current_commit.outputs.rev != steps.get_new_commit.outputs.rev }}
        with:
          owner: ${{ steps.get_new_commit.outputs.owner }}
          repo: ${{ steps.get_new_commit.outputs.repo }}
          basehead: ${{ steps.get_current_commit.outputs.rev }}...${{ steps.get_new_commit.outputs.rev }}
          token: ${{ secrets.GITHUB_TOKEN }}
          include-merge-commits: false

      - name: Generate a GitHub token
        uses: tibdex/github-app-token@32691ba7c9e7063bd457bd8f2a5703138591fa58 # v1
        if: ${{ steps.get_current_commit.outputs.rev != steps.get_new_commit.outputs.rev }}
        id: generate_token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create a pull request to update ${{ matrix.input }}
        if: ${{ steps.get_current_commit.outputs.rev != steps.get_new_commit.outputs.rev }}
        id: create_pr
        uses: peter-evans/create-pull-request@18f7dc018cc2cd597073088f7c7591b9d1c02672 # v3
        with:
          commit-message: "chore(flake/${{ matrix.input }}): ${{ steps.get_current_commit.outputs.short-rev }} -> ${{ steps.get_new_commit.outputs.short-rev }}"
          branch: "create-pull-request/update-${{ matrix.input }}"
          delete-branch: true
          author: "Phillip Ground <cpcloudbot@gmail.com>"
          title: "chore(flake/${{ matrix.input }}): `${{ steps.get_current_commit.outputs.short-rev }}` -> `${{ steps.get_new_commit.outputs.short-rev }}`"
          token: ${{ steps.generate_token.outputs.token }}
          body: ${{ steps.compare_commits.outputs.differences }}
          labels: dependencies,autorebase:opt-in

      - name: Set the PR to automerge
        if: ${{ steps.create_pr.outputs.pull-request-operation == 'created' }}
        uses: peter-evans/enable-pull-request-automerge@21d45e1c52f5d111d2019b5d33f953ed2e735c46 # v1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
          merge-method: rebase
